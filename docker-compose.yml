services:

  backend:
    build: ./backend
    container_name: autoheal-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}

  frontend:
    build: ./frontend
    container_name: autoheal-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend